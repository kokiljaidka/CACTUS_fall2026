site_name: CACTUS Fall 2026
site_description: Computational analysis for communication on text, user-generated content, and social networks. NUS, Fall 2026.
site_url: https://kokiljaidka.github.io/CACTUS_fall2026/
repo_url: https://github.com/kokiljaidka/CACTUS_fall2026
use_directory_urls: false
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: teal
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: teal
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
markdown_extensions:
  - tables
  - attr_list
  - admonition
nav:
  - Home: index.md
  - Weeks:
      - "Week 1: Define your problem, how code thinks": weeks/week01.md
      - "Week 2: Clean it, chart it": weeks/week02.md
  - Project guide: project.md
  - Getting data access: access.md
  - Data: data.md
