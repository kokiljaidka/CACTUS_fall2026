<title>Cactus Code Garden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: header + level map on top, then one puzzle at a time: idea and task on the left, board or code beside a tray of draggable pieces. */
:root {
  --bg: #edf1ec;
  --surface: #f8faf7;
  --surface2: #e0e8df;
  --ink: #15251d;
  --muted: #4f6057;
  --line: #c6d1c4;
  --accent: #237a4b;
  --accent-ink: #ffffff;
  --sun: #d99a1c;
  --water: #2379c4;
  --bad: #b0402e;
  --good: #1d7443;
  --code-bg: #14241c;
  --code-ink: #e4efe6;
  --code-dim: #8fa89a;
  --slot: #d3e3d6;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1814; --surface: #15231d; --surface2: #1e3028; --ink: #e3eee6; --muted: #98ab9f;
    --line: #2b4036; --accent: #4cc080; --accent-ink: #06130c; --sun: #f0ba45; --water: #5bb0f2;
    --bad: #f28d78; --good: #5fd596; --code-bg: #0a120f; --code-ink: #dcebdf; --code-dim: #7f9a8c; --slot: #23382e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1814; --surface: #15231d; --surface2: #1e3028; --ink: #e3eee6; --muted: #98ab9f;
  --line: #2b4036; --accent: #4cc080; --accent-ink: #06130c; --sun: #f0ba45; --water: #5bb0f2;
  --bad: #f28d78; --good: #5fd596; --code-bg: #0a120f; --code-ink: #dcebdf; --code-dim: #7f9a8c; --slot: #23382e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--water); outline-offset: 2px; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.kicker { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-size: clamp(30px, 6vw, 44px); margin-top: 4px; }
.sub { color: var(--muted); max-width: 52ch; margin-top: 6px; }
.meta { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); }
.meta b { color: var(--ink); font-variant-numeric: tabular-nums; }
.linkbtn { background: none; border: 0; padding: 0; text-decoration: underline; color: var(--muted); font-size: 14px; }

/* level map */
#map { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.world { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.world h3 { font-size: 14px; }
.world small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.world ol { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.dot.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.dot.cur { border-color: var(--ink); box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--ink); }

/* level */
.lvl { display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.lvl h2 { font-size: clamp(24px, 4vw, 32px); }
.idea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; max-width: 78ch; }
.idea .where { color: var(--muted); font-size: 14px; }
.task { font-size: 18px; font-weight: 500; max-width: 62ch; }
.play { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .play { grid-template-columns: minmax(0, 1fr); } }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.tray, .prog, .predict, .outbox, .fb, .rowzone { border-radius: 10px; }
.tray { background: var(--surface); border: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.tray .items { display: flex; flex-wrap: wrap; gap: 8px; }
.tipline { font-size: 13px; color: var(--muted); }

/* draggable things */
[data-dragitem] { touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.ghost { position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; opacity: .92; box-shadow: 0 10px 24px rgba(0,0,0,.28); cursor: grabbing; }
body.dragging { cursor: grabbing; }
.over { outline: 3px dashed var(--water); outline-offset: 2px; }
.tok { display: inline-flex; align-items: center; font-family: var(--font-mono); font-size: 14px; font-weight: 500; background: var(--surface2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; white-space: nowrap; color: var(--ink); }
.tok.small { padding: 1px 7px; font-size: 13px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.blk { border-radius: 9px; border: 2px solid var(--accent); background: var(--surface); font-weight: 600; font-size: 15px; display: flex; flex-direction: column; }
.blk.mv { flex-direction: row; align-items: center; gap: 8px; padding: 7px 10px; }
.blk.mv .arr { font-family: var(--font-mono); font-size: 18px; width: 20px; text-align: center; color: var(--accent); }
.blk .x { margin-left: auto; width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--surface2); color: var(--muted); line-height: 1; font-size: 15px; padding: 0; }
.blk.rep { border-color: var(--sun); }
.rep-head { display: flex; align-items: center; gap: 8px; padding: 7px 10px; }
.rep-head .x { margin-left: auto; }
.step { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface2); padding: 0; font-weight: 700; }
.blk.rep > .zone { margin: 0 8px 8px 20px; min-height: 40px; }
.blk.running { outline: 3px solid var(--sun); outline-offset: 1px; }
.zone { display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 2px dashed var(--line); border-radius: 9px; min-height: 64px; background: var(--bg); }
.zone:empty::before { content: attr(data-hint); color: var(--muted); font-size: 14px; margin: auto; padding: 8px; text-align: center; }
.prog { background: var(--surface); border: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.prog .zone { min-height: 110px; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.count.full { color: var(--bad); font-weight: 600; }

/* grid board */
.board { position: relative; width: 100%; max-width: 520px; border-radius: 12px; overflow: hidden; border: 2px solid var(--line); background: var(--surface2); }
.cells { position: absolute; inset: 0; display: grid; }
.cell { position: relative; border: 1px solid var(--line); background: transparent; padding: 0; margin: 0; display: grid; place-items: center; }
.cell:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.cell > span { width: 100%; height: 100%; display: grid; place-items: center; }
.cell svg, .sprite svg { width: 78%; height: 78%; }
.sprite { position: absolute; left: 0; top: 0; display: grid; place-items: center; pointer-events: none; transition: transform .32s ease; }
.sprite.pred { transition: none; }
.qmark { width: 70%; height: 70%; border: 3px dashed var(--sun); border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: var(--sun); font-size: 18px; }

/* code */
.code { background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 14px 14px; font-family: var(--font-mono); font-size: 14px; line-height: 2.1; overflow-x: auto; margin: 0; }
.code .line { white-space: pre; }
.code .dim { color: var(--code-dim); }
.slot { display: inline-flex; align-items: center; justify-content: center; min-width: 74px; min-height: 28px; vertical-align: middle; padding: 0 3px; border: 2px dashed var(--code-dim); border-radius: 7px; color: var(--code-dim); font-size: 12px; line-height: 1.2; }
.slot.filled { border-style: solid; border-color: transparent; padding: 0; min-width: 0; }
.pathzone { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; min-width: 120px; min-height: 30px; padding: 2px 4px; border: 2px dashed var(--code-dim); border-radius: 7px; vertical-align: middle; }
.pathzone:empty::before { content: "drop keys and numbers"; color: var(--code-dim); font-size: 12px; padding: 0 4px; }
.datapre { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; overflow: auto; max-height: 260px; }

/* controls, feedback */
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border-radius: 9px; border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:hover { filter: brightness(1.06); }
.predict { background: var(--surface); border: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 6px; }
.predict textarea { font-family: var(--font-mono); font-size: 14px; width: 100%; resize: vertical; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 8px; }
.outbox { background: var(--code-bg); color: var(--code-ink); padding: 10px 14px; font-family: var(--font-mono); font-size: 14px; white-space: pre-wrap; min-height: 44px; overflow-wrap: anywhere; }
.outbox.err { color: #ffb4a4; }
.fb { padding: 10px 14px; border: 1px solid var(--line); background: var(--surface); display: grid; gap: 10px; justify-items: start; }
.fb:empty { display: none; }
.fb.good { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--surface)); }
.fb.warn { border-color: var(--sun); }
.fb.bad { border-color: var(--bad); }
.lvlnav { display: flex; justify-content: space-between; gap: 8px; padding-top: 6px; }

/* row builder */
.rowzone { border: 2px dashed var(--line); background: var(--bg); padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 90px; }
.rowzone:empty::before { content: "Drag fields here, or tap a field above"; color: var(--muted); font-size: 14px; margin: auto; padding: 10px; text-align: center; }
.field { display: grid; grid-template-columns: minmax(80px, 130px) 1fr auto; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.field code { font-family: var(--font-mono); font-size: 13px; overflow-wrap: anywhere; }
.field input, .addfield input { font: inherit; font-size: 14px; min-width: 0; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 5px 8px; width: 100%; }
.field .x { width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--surface2); color: var(--muted); padding: 0; }
.addfield { display: flex; gap: 8px; }
footer { color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .sprite { transition: none; } }
.code.tight { line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.code, .tok, .datapre, .outbox, .field code { font-variant-ligatures: none; }

</style>
<div class="wrap">
  <header class="top">
    <div>
      <p class="kicker">CACTUS Fall 2026 · Week 1</p>
      <h1>Cactus Code Garden</h1>
      <p class="sub">Sixteen drag-and-drop puzzles that teach how code thinks, then a short real-code task in Colab. The puzzles need no typing.</p>
    </div>
    <div class="meta"><span><b id="count">0</b> of <span id="total">16</span> solved</span><button class="linkbtn" id="resetProg" type="button">Reset progress</button></div>
  </header>
  <nav id="map" aria-label="Levels"></nav>
  <main id="stage"></main>
  <footer>Tip: on a phone you can tap a piece instead of dragging it. Dragging a piece out of the workspace removes it.</footer>
</div>
<script>

const MOVES = { R: ["Right", "→", [1, 0]], L: ["Left", "←", [-1, 0]], U: ["Up", "↑", [0, -1]], D: ["Down", "↓", [0, 1]] };

function buildGrid(def) {

  const predEl = sprite("pred", ""); predEl.append(h("div", { class: "qmark" }, "?")); predEl.hidden = true;
  const placeSprite = (el, p, dx = 0, dy = 0) => { el.style.transform = `translate(${(p[0] + dx) * 100}%, ${(p[1] + dy) * 100}%)`; };
  placeSprite(cactus, st.pos);
  board.append(cells, predEl, cactus);

  const progWrap = h("div"), countEl = h("p", { class: "count" });
  const renderProg = () => {
    progWrap.replaceChildren(makeZone(st.prog, "Drag blocks here"));
    const n = countBlocks(st.prog);
    countEl.textContent = def.max ? `Blocks used: ${n} of ${def.max} allowed` : `Blocks used: ${n}`;
    countEl.classList.toggle("full", !!def.max && n >= def.max);

/* ---------- token helpers ---------- */
function makeTokens(def) {

    const o = (x && typeof x === "object") ? x : { v: x };
    return { id: i, v: o.v, k: o.k, label: o.label || (typeof o.v === "string" ? JSON.stringify(o.v) : String(o.v)) };
  });
}
const tokChip = (tok, info, small) => makeDraggable(h("span", { class: "tok" + (small ? " small" : "") }, tok.label), info);

/* ---------- slot levels (fill the boxes) ---------- */

/* ---------- path levels (build a path into nested data) ---------- */
function walkPath(data, keys) {
  let v = data;
  for (const k of keys) {

      if (k >= v.length) return { err: "IndexError: list index out of range" };
    } else if (v && typeof v === "object") {
      if (typeof k !== "string") return { err: `KeyError: ${k}` };
      if (!(k in v)) return { err: `KeyError: '${k}'` };
    } else return { err: "TypeError: you are already at a single value; it has no more keys to follow" };
    v = v[k];
  }
  return { v };
}
